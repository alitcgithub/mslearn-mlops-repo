name: Deploy model to online endpoint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Azure SDK dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-ml azure-identity

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure ML CLI
        run: |
          az extension add -n ml -y

      - name: Detect Azure ML workspace
        id: detect
        run: |
          RG_NAME=$(az group list --query "[?starts_with(name,'rg-ai300-l')].name | [0]" -o tsv)
          if [ -z "$RG_NAME" ]; then
            echo "No resource group starting with rg-ai300-l found." >&2
            exit 1
          fi
          WS_NAME=$(az ml workspace list --resource-group "$RG_NAME" --query "[?starts_with(name,'mlw-ai300-l')].name | [0]" -o tsv)
          if [ -z "$WS_NAME" ]; then
            echo "No workspace starting with mlw-ai300-l found in $RG_NAME." >&2
            exit 1
          fi
          SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          # unique, deterministic, region-safe name
          SUFFIX="${WS_NAME#mlw-ai300-l}"
          ENDPOINT_NAME="diabetes-endpoint-${SUFFIX:0:8}"
          echo "resource_group=$RG_NAME" >> "$GITHUB_OUTPUT"
          echo "workspace=$WS_NAME" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"
          echo "endpoint_name=$ENDPOINT_NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy model to managed online endpoint
        id: deploy
        run: |
          echo "S T A R T I N G    D E P L O Y M E N T    T O    T A R G E T"
          python src/deploy_to_online_endpoint.py \
            --subscription_id "${{ steps.detect.outputs.subscription_id }}" \
            --resource_group "${{ steps.detect.outputs.resource_group }}" \
            --workspace_name "${{ steps.detect.outputs.workspace }}" \
            --endpoint_name "${{ steps.detect.outputs.endpoint_name }}" \
            --deployment_name "blue"
